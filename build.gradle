plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'Ali.Main'
}

group = 'Ali'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    //adding new dependancy
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform() // testing
}
jar {
    manifest {
        attributes(
                'Main-Class': 'Ali.Main'
        )
    }
}