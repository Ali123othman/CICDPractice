plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0' //We use the Shadow plugin because it packages your application and all runtime dependencies (like Gson) into one JAR.
}

application {
    mainClass = 'io.github.ali123othman.cicdpractice.Main'
}

group = 'io.github.ali123othman.cicdpractice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    //adding new dependancy
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform() // testing
}
jar {
    manifest {
        attributes(
                'Main-Class': 'io.github.ali123othman.cicdpractice.Main'
        )
    }
}