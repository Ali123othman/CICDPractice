name: JavaPractice CI/CD

# Run CI when creating/updating a PR and run CI/CD when changes reach main
on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:

  # Continuous Integration: build the app and verify that tests pass
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # Get the project files from the repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Install the Java version required by the project
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # Linux runners need execute permission for Gradle wrapper
      - name: Grant execute permission
        run: chmod +x gradlew


      # Compile the application and run automated tests
      - name: Build project and run tests
        run: ./gradlew build


      # Save the generated JAR so the Docker job can use the same build output
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-all.jar



  # Continuous Deployment: package the application and publish the Docker image
  docker:
    name: Build and Push Docker Image

    # Wait for CI to finish successfully before creating an image
    needs: build

    # Only publish images after code is pushed to main, not on pull requests
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # Get the repository files, including the Dockerfile
      - name: Checkout repository
        uses: actions/checkout@v4


      # Retrieve the JAR created during the CI job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs


      # Authenticate with Docker Hub using stored repository secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESTOKEN }}


      # Create two tags for the same image:
      # - run_number keeps a specific version for rollback
      # - latest always points to the newest build
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/cicdpractice:${{ github.run_number }} \
          -t ${{ secrets.DOCKER_USERNAME }}/cicdpractice:latest \
          .


      # Upload both image tags to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cicdpractice:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cicdpractice:latest