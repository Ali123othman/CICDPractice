name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to roll back to (full commit SHA or run number, e.g. 56)"
        required: true

permissions:
  contents: read

# Same group as the deploy job, so a rollback and a deploy never overlap
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back Render to an older image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESTOKEN }}

      # Fail early on a typo instead of sending Render a tag that doesn't exist
      - name: Verify the image tag exists
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/cicdpractice
          TAG: ${{ inputs.tag }}
        run: |
          docker manifest inspect "docker.io/$IMAGE:$TAG" > /dev/null \
            || { echo "Tag '$TAG' not found on Docker Hub"; exit 1; }

      - name: Redeploy the old image on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/cicdpractice
          TAG: ${{ inputs.tag }}
        run: |
          curl --fail -sS -X POST -G "$HOOK" \
            --data-urlencode "imgURL=docker.io/$IMAGE:$TAG"