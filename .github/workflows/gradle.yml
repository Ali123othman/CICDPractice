name: JavaPractice CI
#When the workflow runs
on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]
#Defines the work to perform
jobs:
  build:
#GitHub creates a fresh Ubuntu virtual machine
    runs-on: ubuntu-latest
#Downloads your repository onto that machine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
#Installs Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
#Makes the Gradle wrapper executable on Linux
      - name: Grant execute permission
        run: chmod +x gradlew
#Builds your project
      - name: Build project
        run: ./gradlew build